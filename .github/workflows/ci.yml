name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: masraf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/masraf?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/masraf?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters-long
      COOKIE_SECRET: ci-cookie-secret-minimum-32-characters-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: auto
      S3_BUCKET: masraf-attachments
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_TTL_MS: "60000"
      RATE_LIMIT_MAX: "100"
      AUTH_RATE_LIMIT_MAX: "5"
      LOG_LEVEL: error
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      VITE_API_URL: http://localhost:4000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @masraf/shared-types build && pnpm --filter @masraf/shared-validation build

      - name: Prisma migrate
        run: pnpm --filter @masraf/api exec prisma migrate deploy
        working-directory: apps/api

      - name: Seed database
        run: pnpm --filter @masraf/api exec prisma db seed
        working-directory: apps/api

      - name: Unit tests (API + Web)
        run: pnpm test

      - name: E2E tests (API)
        run: pnpm --filter @masraf/api exec jest --config test/jest-e2e.json --forceExit
        working-directory: apps/api

      - name: TypeScript check
        run: pnpm --filter @masraf/api exec tsc --noEmit && pnpm --filter @masraf/web exec tsc --noEmit
